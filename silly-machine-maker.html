<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Silly Machine Maker</title>
<style>
  :root{
    --bg:#fdf6e3; --panel:#ffffff; --ink:#333; --go:#4cc24c; --stop:#ff8c42; --magic:#a66bff; --grey:#cfd6dd;
    --tile:#fff; --tile-edge:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;}
  h1{font-size:clamp(16px,2.6vw,26px);margin:0;white-space:nowrap;}
  .btns{display:flex;gap:8px;align-items:center;}
  button{font:inherit;cursor:pointer;border:none;border-radius:18px;color:#fff;font-weight:900;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s;touch-action:manipulation;}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .big{font-size:clamp(16px,2.4vw,24px);padding:10px 20px;min-width:64px;min-height:52px;}
  .go{background:var(--go);} .go.stop{background:var(--stop);} .magic{background:var(--magic);}
  .clear{background:var(--grey);color:#333;} .snd{background:#64b5f6;}
  main{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px 10px;}
  #stageWrap{position:relative;width:min(100vw - 20px,(100vh - 215px) * 1.6);aspect-ratio:16/10;}
  canvas#stage{display:block;width:100%;height:100%;border-radius:22px;touch-action:none;
    box-shadow:0 10px 30px rgba(0,0,0,.15);background:#cdeeff;}
  #toast{position:absolute;left:50%;top:12px;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;
    background:#fff;padding:10px 24px;border-radius:30px;font-size:clamp(18px,3vw,34px);font-weight:900;
    box-shadow:0 6px 20px rgba(0,0,0,.2);transition:all .25s;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1);}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(255,255,255,.55);border-radius:22px;backdrop-filter:blur(2px);}
  .overlay.hidden{display:none;}
  .card{background:#fff;border-radius:30px;padding:24px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);
    animation:pop .4s cubic-bezier(.3,1.6,.5,1);}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  .card h2{margin:0 0 14px;font-size:clamp(24px,4vw,44px);white-space:nowrap;}
  .card .btns{justify-content:center;flex-wrap:wrap;}
  #palette{display:flex;gap:10px;flex-wrap:nowrap;justify-content:center;width:100%;overflow-x:auto;padding:6px 4px 10px;}
  .tile{flex:0 0 auto;width:clamp(78px,10vw,112px);background:var(--tile);border:4px solid var(--tile-edge);border-radius:20px;
    display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;touch-action:none;cursor:grab;
    box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .1s;}
  .tile:active{transform:scale(.95);} .tile.wiggle{animation:wig .5s;}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .tile canvas{width:100%;height:auto;display:block;}
  .tile span{font-size:clamp(13px,1.6vw,18px);font-weight:900;}
</style>
</head>
<body>
<header>
  <h1>🤖 Silly Machine Maker</h1>
  <div class="btns">
    <button id="goBtn" class="big go">▶ GO!</button>
    <button id="magicBtn" class="big magic">✨ Magic</button>
    <button id="clearBtn" class="big clear" title="Clear">🧹</button>
    <button id="soundBtn" class="big snd" title="Sound">🔊</button>
  </div>
</header>
<main>
  <div id="stageWrap">
    <canvas id="stage" width="960" height="600"></canvas>
    <div id="toast"></div>
    <div id="win" class="overlay hidden">
      <div class="card">
        <h2>🎉 YOU DID IT! 🎉</h2>
        <div class="btns">
          <button id="againBtn" class="big go">▶ Again</button>
          <button id="winMagicBtn" class="big magic">✨ Magic</button>
          <button id="buildBtn" class="big clear">🔧 Build</button>
        </div>
      </div>
    </div>
    <div id="confirm" class="overlay hidden">
      <div class="card">
        <h2>Clear everything? 😮</h2>
        <div class="btns">
          <button id="yesClear" class="big go">Yes 🧹</button>
          <button id="noClear" class="big clear">No</button>
        </div>
      </div>
    </div>
  </div>
  <div id="palette"></div>
</main>
<script>
(function(){
'use strict';
const W=960,H=600,FLOOR=H-20,G=1100,STEP=1/240;
const TRASH={x:W-52,y:H-52,r:40};
const RAMP_A=0.42;
const BOX={ramp:{w:180,h:16},plank:{w:180,h:16},trampoline:{w:110,h:18},domino:{w:14,h:64},fan:{w:50,h:50}};
const RAD={ball:16,bumper:24,bell:24};
const TYPES=['ball','ramp','plank','trampoline','domino','bumper','fan','bell'];
const LABEL={ball:'Ball',ramp:'Ramp',plank:'Shelf',trampoline:'Bouncer',domino:'Domino',bumper:'Bumper',fan:'Fan',bell:'Bell'};
const BALL_COLORS=['#ff5e5e','#4d8bff','#ffc93c','#6fd36f','#ff8bd4','#9b6bff','#ff9d42'];
const SAVE_KEY='rube.kids.v1';

const canvas=document.getElementById('stage');let ctx=canvas.getContext('2d');
const goBtn=document.getElementById('goBtn'), toastEl=document.getElementById('toast');
const winEl=document.getElementById('win'), confirmEl=document.getElementById('confirm');

let pieces=[], nextId=1, mode='build', sim=null, drag=null, confetti=[], acc=0, rotor=0, soundOn=true, toastTimer=0, lastTapAt=0;

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a), rndi=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function randColor(){return pick(BALL_COLORS);}
function makePiece(type,x,y,extra){const p=Object.assign({id:nextId++,type,x,y,flip:1,pop:1},extra||{});if(type==='ball'&&!p.color)p.color=randColor();return p;}

function dominoBox(p){const {w,h}=BOX.domino;const d=p.dir||1,th=p.angle||0;const px=p.x+d*w/2,py=p.y+h/2;const lx=-d*w/2,ly=-h/2,c=Math.cos(th),s=Math.sin(th);
  return {x:px+lx*c-ly*s,y:py+lx*s+ly*c,w,h,a:th};}
function dominoTip(p){const {w,h}=BOX.domino;const d=p.dir||1,th=p.angle||0;const px=p.x+d*w/2,py=p.y+h/2;const lx=-d*w/2,ly=-h,c=Math.cos(th),s=Math.sin(th);
  return {x:px+lx*c-ly*s,y:py+lx*s+ly*c};}
function pieceBox(p){const b=BOX[p.type];if(!b)return null;if(p.type==='domino')return dominoBox(p);
  return {x:p.x,y:p.y,w:b.w,h:b.h,a:p.type==='ramp'?RAMP_A*(p.flip||1):0};}
function fanZone(p){const d=p.flip||1;const x0=p.x+d*25;return {x1:Math.min(x0,x0+d*230),x2:Math.max(x0,x0+d*230),y1:p.y-50,y2:p.y+50,d};}

function hitPiece(p,x,y){const r=RAD[p.type];if(r)return Math.hypot(x-p.x,y-p.y)<=r+10;
  const b=pieceBox(p);const c=Math.cos(b.a),s=Math.sin(b.a);const dx=x-b.x,dy=y-b.y;const lx=dx*c+dy*s,ly=-dx*s+dy*c;
  return Math.abs(lx)<=b.w/2+8&&Math.abs(ly)<=b.h/2+10;}
function inTrash(x,y){return Math.hypot(x-TRASH.x,y-TRASH.y)<=TRASH.r+6;}

// ---------- physics ----------
function circleBox(bx,by,r,box){const c=Math.cos(box.a),s=Math.sin(box.a);const dx=bx-box.x,dy=by-box.y;const lx=dx*c+dy*s,ly=-dx*s+dy*c;
  const hw=box.w/2,hh=box.h/2;const cx=clamp(lx,-hw,hw),cy=clamp(ly,-hh,hh);let nx=lx-cx,ny=ly-cy;let d=Math.hypot(nx,ny);
  if(d>=r)return null;let pen;
  if(d<1e-6){const ox=hw-Math.abs(lx),oy=hh-Math.abs(ly);if(ox<oy){nx=Math.sign(lx)||1;ny=0;pen=r+ox;}else{nx=0;ny=Math.sign(ly)||1;pen=r+oy;}}
  else{nx/=d;ny/=d;pen=r-d;}
  return {nx:nx*c-ny*s,ny:nx*s+ny*c,pen};}
function bounce(b,c,e,fric,minOut){b.x+=c.nx*c.pen;b.y+=c.ny*c.pen;const vn=b.vx*c.nx+b.vy*c.ny;c.vn=vn;
  if(vn<0){let out=-vn*e;if(minOut&&-vn>40)out=Math.max(out,minOut);let tx=b.vx-vn*c.nx,ty=b.vy-vn*c.ny;tx*=(1-fric);ty*=(1-fric);b.vx=tx+c.nx*out;b.vy=ty+c.ny*out;}
  return c;}
function resolveBox(b,box,e,fric,minOut){const c=circleBox(b.x,b.y,b.r,box);return c?bounce(b,c,e,fric,minOut):null;}
function resolveCircle(b,cx,cy,cr,e,minOut){const dx=b.x-cx,dy=b.y-cy;const d=Math.hypot(dx,dy);if(d>=b.r+cr)return null;
  const nx=d>1e-6?dx/d:0,ny=d>1e-6?dy/d:-1;return bounce(b,{nx,ny,pen:b.r+cr-d},e,0,minOut);}

function createSim(src){
  const s={t:0,won:false,events:[],balls:[],statics:[],dominoes:[],fans:[],bells:[],bumpers:[],endTimer:0,finished:false};
  for(const p of src){
    if(p.type==='ball'){s.balls.push({x:p.x,y:p.y,r:RAD.ball,vx:0,vy:0,color:p.color,still:0,gone:false,lastSnd:0});continue;}
    const q=Object.assign({},p);
    if(q.type==='domino'){q.state='stand';q.dir=1;q.angle=0;q.t=0;s.dominoes.push(q);}
    else if(q.type==='fan')s.fans.push(q);
    else if(q.type==='bell'){q.rung=false;q.wob=0;s.bells.push(q);}
    else if(q.type==='bumper'){q.hit=0;s.bumpers.push(q);}
    s.statics.push(q);
  }
  s.triggerDomino=function(d,dir){if(d.state!=='stand')return;d.state='fall';d.dir=dir;d.t=0;s.events.push({k:'clack',x:d.x,y:d.y});};
  s.ring=function(bell){bell.wob=1;if(!bell.rung){bell.rung=true;s.events.push({k:'bell',x:bell.x,y:bell.y});if(!s.won){s.won=true;s.events.push({k:'win',x:bell.x,y:bell.y});}}};
  s.step=function(dt){
    s.t+=dt;
    for(const b of s.balls){
      if(b.gone)continue;
      b.vy+=G*dt;
      let inFan=false;
      for(const f of s.fans){const z=fanZone(f);if(b.x>z.x1&&b.x<z.x2&&b.y>z.y1&&b.y<z.y2){b.vx+=z.d*1400*dt;inFan=true;}}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<b.r){b.x=b.r;if(b.vx<0)b.vx=-b.vx*.5;}if(b.x>W-b.r){b.x=W-b.r;if(b.vx>0)b.vx=-b.vx*.5;}
      if(b.y<b.r){b.y=b.r;if(b.vy<0)b.vy=-b.vy*.5;}
      if(b.y>FLOOR-b.r){b.y=FLOOR-b.r;if(b.vy>0){if(b.vy>120)s.events.push({k:'bonk',x:b.x,y:b.y,b});b.vy=-b.vy*.4;}b.vx*=0.985;}
      if(b.y>H+80)b.gone=true;
      for(const q of s.statics){
        if(q.type==='ramp'||q.type==='plank'){const c=resolveBox(b,pieceBox(q),.35,.004);if(c&&c.vn<-100)s.events.push({k:'bonk',x:b.x,y:b.y,b});}
        else if(q.type==='trampoline'){const c=resolveBox(b,pieceBox(q),.9,0,560);if(c&&c.vn<-40){s.events.push({k:'boing',x:b.x,y:b.y,b});q.squish=1;}}
        else if(q.type==='fan'){resolveBox(b,pieceBox(q),.4,.01);}
        else if(q.type==='domino'){const c=resolveBox(b,dominoBox(q),.3,.01);
          if(c){const sp=Math.hypot(b.vx,b.vy);if(q.state==='stand'&&Math.abs(c.nx)>.5&&sp>25)s.triggerDomino(q,c.nx<0?1:-1);
            if(q.state==='fall'){b.vx=q.dir*Math.max(Math.abs(b.vx),170);}}}
        else if(q.type==='bumper'){const c=resolveCircle(b,q.x,q.y,RAD.bumper,1,420);if(c&&c.vn<-30){q.hit=1;s.events.push({k:'bumper',x:b.x,y:b.y,b});}}
        else if(q.type==='bell'){const c=resolveCircle(b,q.x,q.y,RAD.bell,.5);if(c&&c.vn<-20)s.ring(q);}
      }
      const sp=Math.hypot(b.vx,b.vy);b.still=(sp<12&&!inFan)?b.still+dt:0;
    }
    for(let i=0;i<s.balls.length;i++)for(let j=i+1;j<s.balls.length;j++){const a=s.balls[i],b=s.balls[j];if(a.gone||b.gone)continue;
      const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy);if(d<a.r+b.r&&d>1e-6){const nx=dx/d,ny=dy/d;const sep=(a.r+b.r-d)/2;a.x-=nx*sep;a.y-=ny*sep;b.x+=nx*sep;b.y+=ny*sep;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const jm=-(1+.8)*rv/2;a.vx-=jm*nx;a.vy-=jm*ny;b.vx+=jm*nx;b.vy+=jm*ny;if(-rv>80)s.events.push({k:'bonk',x:a.x,y:a.y,b:a});}}}
    for(const d of s.dominoes){
      if(d.state!=='fall')continue;d.t+=dt;let p=Math.min(1,d.t/.38);d.angle=d.dir*1.45*Math.pow(p,1.7);
      const tip=dominoTip(d);
      for(const o of s.dominoes){if(o===d||o.state!=='stand')continue;if(Math.abs(tip.x-o.x)<BOX.domino.w/2+6&&tip.y>o.y-BOX.domino.h/2-2&&tip.y<o.y+BOX.domino.h/2+6)s.triggerDomino(o,d.dir);}
      for(const bl of s.bells){if(Math.hypot(tip.x-bl.x,tip.y-bl.y)<RAD.bell+6)s.ring(bl);}
      if(p>=1)d.state='down';
    }
    for(const q of s.statics){if(q.squish)q.squish=Math.max(0,q.squish-dt*4);if(q.hit)q.hit=Math.max(0,q.hit-dt*4);}
    for(const bl of s.bells)if(bl.wob>0)bl.wob=Math.max(0,bl.wob-dt*.6);
    const falling=s.dominoes.some(d=>d.state==='fall');
    const active=s.balls.some(b=>!b.gone&&b.still<1.3);
    if(!active&&!falling&&s.t>0.8)s.finished=true;
    if(s.t>45)s.finished=true;
  };
  return s;
}
function validate(src,maxT){const s=createSim(src);let t=0;while(t<(maxT||20)){s.step(STEP);t+=STEP;if(s.won)return true;if(s.finished)return false;}return false;}

// ---------- sound ----------
let actx=null;
function audio(){if(!soundOn)return null;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,dur,type,vol,f2){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);g.gain.setValueAtTime(vol||.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);}
const SFX={
  bonk:()=>tone(180,.07,'triangle',.18,120), boing:()=>tone(250,.3,'sine',.25,900), bumper:()=>tone(700,.1,'square',.12,500),
  clack:()=>tone(1400,.04,'square',.12,500), bell:()=>{tone(1760,.9,'sine',.3);tone(2637,.6,'sine',.12);},
  pop:()=>tone(500,.1,'sine',.2,900), flip:()=>tone(400,.08,'triangle',.15,600), trash:()=>tone(300,.2,'sawtooth',.12,80),
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.25),i*130));},
  fail:()=>tone(300,.4,'sine',.2,150), go:()=>tone(600,.15,'triangle',.2,900)
};

// ---------- drawing ----------
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawPlank(w,h,color,stripe){roundRect(-w/2,-h/2,w,h,6);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#5b3a1a';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle=stripe;for(let x=-w/2+14;x<w/2-10;x+=28){ctx.fillRect(x,-h/2+4,12,h-8);}}
function drawPiece(p,opts){
  opts=opts||{};const live=opts.live;
  ctx.save();
  if(p.pop>0&&!live){const sc=1+Math.sin(p.pop*Math.PI)*.25;ctx.translate(p.x,p.y);ctx.scale(sc,sc);ctx.translate(-p.x,-p.y);}
  if(opts.glow){ctx.shadowColor='rgba(255,220,0,.9)';ctx.shadowBlur=22;}
  switch(p.type){
    case 'ball':{ctx.translate(p.x,p.y);const r=RAD.ball;const g=ctx.createRadialGradient(-5,-6,2,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.25,p.color||'#f55');g.addColorStop(1,shade(p.color||'#f55'));
      ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-5,-3,2.4,0,7);ctx.arc(5,-3,2.4,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,3,5,.2,Math.PI-.2);ctx.lineWidth=2;ctx.strokeStyle='#222';ctx.stroke();break;}
    case 'ramp':case 'plank':{const b=pieceBox(p);ctx.translate(b.x,b.y);ctx.rotate(b.a);drawPlank(b.w,b.h,'#c98a4b','#b07438');break;}
    case 'trampoline':{const b=pieceBox(p);ctx.translate(b.x,b.y);const sq=1-(p.squish||0)*.4;
      ctx.strokeStyle='#555';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-b.w/2+10,0);ctx.lineTo(-b.w/2+16,26);ctx.moveTo(b.w/2-10,0);ctx.lineTo(b.w/2-16,26);ctx.stroke();
      ctx.scale(1,sq);roundRect(-b.w/2,-b.h/2,b.w,b.h,8);ctx.fillStyle='#2f8cff';ctx.fill();ctx.strokeStyle='#17417a';ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle='#8fd0ff';ctx.lineWidth=2;ctx.beginPath();for(let x=-b.w/2+10;x<b.w/2-5;x+=12){ctx.moveTo(x,-4);ctx.lineTo(x+6,4);}ctx.stroke();break;}
    case 'domino':{const b=dominoBox(p);ctx.translate(b.x,b.y);ctx.rotate(b.a);roundRect(-b.w/2,-b.h/2,b.w,b.h,4);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle='#222';ctx.fillRect(-b.w/2+2,-1,b.w-4,2);[-22,-12,10,20].forEach(y=>{ctx.beginPath();ctx.arc(0,y,2.2,0,7);ctx.fill();});break;}
    case 'bumper':{ctx.translate(p.x,p.y);const sc=1+(p.hit||0)*.25;ctx.scale(sc,sc);ctx.beginPath();ctx.arc(0,0,RAD.bumper,0,7);ctx.fillStyle='#ff4a4a';ctx.fill();ctx.strokeStyle='#a00';ctx.lineWidth=4;ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,RAD.bumper-9,0,7);ctx.fillStyle='#ffd34a';ctx.fill();ctx.fillStyle='#a00';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);break;}
    case 'fan':{const d=p.flip||1;ctx.translate(p.x,p.y);
      if(live){ctx.save();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3;ctx.setLineDash([14,14]);ctx.lineDashOffset=-rotor*120*d;ctx.beginPath();
        for(let i=-1;i<=1;i++){ctx.moveTo(d*30,i*22);ctx.lineTo(d*230,i*30);}ctx.stroke();ctx.restore();}
      roundRect(-25,-25,50,50,10);ctx.fillStyle='#8fa3b5';ctx.fill();ctx.strokeStyle='#4b5c6b';ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.fillStyle='#dfe8f0';ctx.fill();ctx.stroke();
      ctx.save();ctx.rotate(live?rotor*12:0);ctx.fillStyle='#4b5c6b';for(let i=0;i<3;i++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.ellipse(0,-10,5,10,0,0,7);ctx.fill();}ctx.restore();
      ctx.fillStyle='#ffd34a';ctx.beginPath();ctx.moveTo(d*27,-10);ctx.lineTo(d*42,0);ctx.lineTo(d*27,10);ctx.closePath();ctx.fill();break;}
    case 'bell':{ctx.translate(p.x,p.y);const w=p.wob||0;ctx.rotate(Math.sin(w*40)*w*.5);ctx.font='56px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🔔',0,2);if(p.rung){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 18px sans-serif';ctx.fillText('♪',34-w*10,-26);ctx.fillText('♫',-36+w*10,-20);}break;}
  }
  ctx.restore();
}
function shade(hex){try{const n=parseInt(hex.slice(1),16);const r=(n>>16)*.55|0,g=((n>>8)&255)*.55|0,b=(n&255)*.55|0;return `rgb(${r},${g},${b})`;}catch(e){return '#333';}}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#bfe7ff');g.addColorStop(1,'#eaf8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.8)';[[120,70,1],[520,110,.7],[780,60,.9]].forEach(([x,y,s])=>{ctx.beginPath();ctx.arc(x,y,26*s,0,7);ctx.arc(x+28*s,y-10*s,32*s,0,7);ctx.arc(x+60*s,y,24*s,0,7);ctx.fill();});
  ctx.fillStyle='#7ed46b';ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.fillStyle='#5fb84f';for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x+8,FLOOR-9);ctx.lineTo(x+14,FLOOR);ctx.fill();}}
function drawTrash(hover){ctx.save();ctx.translate(TRASH.x,TRASH.y);ctx.beginPath();ctx.arc(0,0,TRASH.r,0,7);ctx.fillStyle=hover?'rgba(255,120,120,.8)':'rgba(255,255,255,.55)';ctx.fill();
  ctx.setLineDash([8,8]);ctx.strokeStyle='#777';ctx.lineWidth=3;ctx.stroke();ctx.font=(hover?'46px':'38px')+' "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🗑️',0,3);ctx.restore();}
function draw(){
  drawBackground();
  if(mode==='build'){
    drawTrash(drag&&drag.overTrash);
    for(const p of pieces){if(p.type==='fan'){ctx.save();const z=fanZone(p);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(z.x1,z.y1,z.x2-z.x1,z.y2-z.y1);ctx.restore();}}
    for(const p of pieces)drawPiece(p,{glow:drag&&drag.piece===p});
    if(pieces.length===0&&!drag){ctx.fillStyle='rgba(0,0,0,.55)';ctx.font='bold 40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Tap a piece below! 👇',W/2,H/2-20);
      ctx.font='bold 26px sans-serif';ctx.fillText('Then press ▶ GO!',W/2,H/2+36);}
  }else if(sim){
    for(const q of sim.statics)drawPiece(q,{live:true});
    for(const b of sim.balls)if(!b.gone)drawPiece({type:'ball',x:b.x,y:b.y,color:b.color,pop:0},{live:true});
  }
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle=c.col;ctx.fillRect(-c.s/2,-c.s/2,c.s,c.s*.6);ctx.restore();}
}

// ---------- game loop ----------
function tick(dt){
  rotor+=dt;
  for(const p of pieces)if(p.pop>0)p.pop=Math.max(0,p.pop-dt*2.5);
  if(mode==='play'&&sim){
    acc+=dt;let n=0;while(acc>=STEP&&n<40){sim.step(STEP);acc-=STEP;n++;}
    for(const ev of sim.events){
      if(ev.b){if(rotor-ev.b.lastSnd<.08)continue;ev.b.lastSnd=rotor;}
      if(SFX[ev.k])SFX[ev.k]();
      if(ev.k==='win'){spawnConfetti(ev.x,ev.y);setTimeout(()=>{if(mode==='play'&&sim&&sim.won)winEl.classList.remove('hidden');},900);}
    }
    sim.events.length=0;
    if(sim.finished&&!sim.won){sim.endTimer+=dt;if(sim.endTimer>1.2){toast(pick(['Hmm! Try again 🔧','Almost! Fix it! 🔧','Oops! Move a piece 🔧']));SFX.fail();stopPlay();}}
  }
  for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.vy+=600*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.a+=c.va*dt;c.life-=dt;if(c.life<=0||c.y>H+20)confetti.splice(i,1);}
}
function spawnConfetti(x,y){for(let i=0;i<160;i++){const fromTop=i%2===0;confetti.push({x:fromTop?Math.random()*W:x,y:fromTop?-10:y,vx:rnd(-250,250),vy:fromTop?rnd(50,200):rnd(-600,-150),a:rnd(0,6),va:rnd(-8,8),s:rnd(8,16),col:pick(BALL_COLORS),life:rnd(2,4)});}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(dt<=0)return;tick(dt);draw();}
window.__stepOnce=ms=>{if(mode!=='play')return false;tick(ms/1000);draw();return true;};

// ---------- modes ----------
function startPlay(){if(mode==='play')return;if(!pieces.some(p=>p.type==='ball')){toast('Add a ball! ⚽');wiggleTile('ball');return;}
  sim=createSim(pieces);acc=0;mode='play';goBtn.textContent='■ STOP';goBtn.classList.add('stop');winEl.classList.add('hidden');SFX.go();}
function stopPlay(){mode='build';sim=null;goBtn.textContent='▶ GO!';goBtn.classList.remove('stop');winEl.classList.add('hidden');confetti.length=0;}
function toast(msg,ms){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),ms||1600);}
function wiggleTile(type){const t=document.querySelector(`.tile[data-type="${type}"]`);if(!t)return;t.classList.remove('wiggle');void t.offsetWidth;t.classList.add('wiggle');}

// ---------- persistence ----------
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({pieces:pieces.map(p=>({type:p.type,x:p.x,y:p.y,flip:p.flip,color:p.color})),sound:soundOn}));}catch(e){}}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const d=JSON.parse(raw);if(d&&Array.isArray(d.pieces)){pieces=d.pieces.filter(p=>p&&TYPES.includes(p.type)&&isFinite(p.x)&&isFinite(p.y))
  .map(p=>makePiece(p.type,clamp(p.x,0,W),clamp(p.y,0,H),{flip:p.flip===-1?-1:1,color:typeof p.color==='string'&&/^#[0-9a-f]{6}$/i.test(p.color)?p.color:undefined,pop:0}));}
  if(d&&d.sound===false){soundOn=false;document.getElementById('soundBtn').textContent='🔇';}}catch(e){pieces=[];}}

// ---------- magic generator ----------
function genCandidate(){
  const ps=[];const add=(type,x,y,extra)=>{const p=makePiece(type,x,y,extra);p.pop=0;ps.push(p);return p;};
  let dir=Math.random()<.5?1:-1;let x=dir===1?rnd(90,260):rnd(700,870);let y=rnd(45,80);
  add('ball',x,y);if(Math.random()<.3)add('ball',x+dir*-40,y-10);
  const rows=rndi(2,4);const zig=Math.random()<.6;
  for(let i=0;i<rows;i++){
    const rx=x+dir*rnd(35,70),ry=y+rnd(75,115);
    if(i>0&&Math.random()<.2){add('trampoline',rx,ry+20);x=rx+dir*rnd(20,60);y=ry-40;}
    else{add('ramp',rx,ry,{flip:dir});x=rx+dir*82;y=ry+37;}
    if(zig)dir=-dir;if(x<90)dir=1;if(x>870)dir=-1;
  }
  const fin=pick(['domino','domino','fan','tramp','bumper']);
  let sy=Math.min(y+rnd(70,100),FLOOR);const onFloor=sy>FLOOR-60;if(onFloor)sy=FLOOR;
  const shelf=(sx0,len)=>{if(onFloor)return;for(let k=0;k<len;k++)add('plank',sx0+dir*(90+180*k),sy);};
  if(fin==='domino'){const sx=x+dir*20;if(sx+dir*430<30||sx+dir*430>930)dir=-dir;const start=x+dir*20;shelf(start,2);
    const n=rndi(4,6);for(let k=0;k<n;k++)add('domino',start+dir*(70+40*k),sy-8-32);add('bell',start+dir*(70+40*n+8),sy-8-30);}
  else if(fin==='fan'){if(x+dir*380<30||x+dir*380>930)dir=-dir;const start=x-dir*60;shelf(start,2);add('fan',start+dir*15,sy-8-25,{flip:dir});add('bell',start+dir*330,sy-8-26);}
  else if(fin==='tramp'){add('trampoline',x+dir*rnd(30,60),Math.min(y+rnd(90,130),FLOOR-10));add('bell',x+dir*rnd(90,170),y-rnd(10,90));}
  else{add('bumper',x+dir*rnd(20,50),y+rnd(90,130));add('bell',x+dir*rnd(120,200),y+rnd(20,100));}
  for(const p of ps){if(p.x<30||p.x>930||p.y<25||p.y>FLOOR-6)return null;if(inTrash(p.x,p.y)&&p.type!=='bell')return null;}
  return ps;
}
const FALLBACK=[['ball',120,60],['ramp',180,160,1],['ramp',420,300,1],['plank',640,470],['plank',820,470],['domino',600,430],['domino',640,430],['domino',680,430],['domino',720,430],['bell',770,432]];
function fallbackMachine(){return FALLBACK.map(([t,x,y,f])=>makePiece(t,x,y,{flip:f||1,pop:0}));}
function randomMachine(){for(let i=0;i<120;i++){const c=genCandidate();if(c&&validate(c))return c;}return fallbackMachine();}
function magic(){stopPlay();pieces=randomMachine();for(const p of pieces)p.pop=1;save();toast('✨ Watch this! ✨');SFX.pop();setTimeout(()=>{if(mode==='build')startPlay();},900);}

// ---------- input ----------
function toWorld(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function beginDrag(piece,pos,fromPalette,pid){drag={piece,pid,dx:pos.x-piece.x,dy:pos.y-piece.y,sx:pos.x,sy:pos.y,t0:performance.now(),moved:false,fromPalette,overTrash:false};
  pieces=pieces.filter(p=>p!==piece);pieces.push(piece);}
canvas.addEventListener('pointerdown',e=>{if(mode!=='build'||drag)return;const pos=toWorld(e);
  for(let i=pieces.length-1;i>=0;i--){if(hitPiece(pieces[i],pos.x,pos.y)){beginDrag(pieces[i],pos,false,e.pointerId);e.preventDefault();return;}}});
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const pos=toWorld(e);
  if(Math.hypot(pos.x-drag.sx,pos.y-drag.sy)>7)drag.moved=true;
  drag.piece.x=clamp(pos.x-drag.dx,-30,W+30);drag.piece.y=clamp(pos.y-drag.dy,-30,H+30);drag.outside=pos.x<0||pos.x>W||pos.y<0||pos.y>H;drag.overTrash=inTrash(pos.x,pos.y);});
function endDrag(e){if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;const p=d.piece;
  if(!d.moved&&performance.now()-d.t0<500){
    if(d.fromPalette){const spot=findSpot();p.x=spot.x;p.y=spot.y;p.pop=1;SFX.pop();}
    else{if(p.type==='ramp'||p.type==='fan'){p.flip=-p.flip;SFX.flip();}p.pop=1;}
  }else if(d.overTrash||d.outside){pieces=pieces.filter(q=>q!==p);SFX.trash();}
  else{p.x=clamp(p.x,10,W-10);p.y=clamp(p.y,10,FLOOR-4);p.pop=.6;}
  save();}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);
function findSpot(){for(let i=0;i<30;i++){const x=rnd(120,W-160),y=rnd(80,FLOOR-80);if(!pieces.some(p=>Math.hypot(p.x-x,p.y-y)<90)&&!inTrash(x,y))return {x,y};}return {x:W/2,y:H/2};}

// palette
const pal=document.getElementById('palette');
for(const t of TYPES){const tile=document.createElement('div');tile.className='tile';tile.dataset.type=t;const c=document.createElement('canvas');c.width=200;c.height=130;tile.appendChild(c);
  const lbl=document.createElement('span');lbl.textContent=LABEL[t];tile.appendChild(lbl);pal.appendChild(tile);
  const pc=c.getContext('2d');const realCtx=ctx;
  pc.save();pc.translate(100,65);const sc=t==='domino'?1.1:(t==='ball'||t==='bumper'||t==='bell')?1.5:t==='fan'?1.2:.9;pc.scale(sc,sc);
  ctx=pc;drawPiece({type:t,x:0,y:0,flip:1,pop:0,color:'#ff5e5e'});ctx=realCtx;pc.restore();
  tile.addEventListener('pointerdown',e=>{if(mode!=='build'||drag)return;audio();const pos=toWorld(e);const p=makePiece(t,pos.x,pos.y);p.pop=0;pieces.push(p);beginDrag(p,pos,true,e.pointerId);e.preventDefault();});
}

// buttons
goBtn.addEventListener('click',()=>{audio();if(mode==='play')stopPlay();else startPlay();});
document.getElementById('magicBtn').addEventListener('click',()=>{audio();magic();});
document.getElementById('winMagicBtn').addEventListener('click',()=>{magic();});
document.getElementById('againBtn').addEventListener('click',()=>{stopPlay();startPlay();});
document.getElementById('buildBtn').addEventListener('click',()=>{stopPlay();});
document.getElementById('clearBtn').addEventListener('click',()=>{if(mode==='play')stopPlay();if(pieces.length===0)return;confirmEl.classList.remove('hidden');});
document.getElementById('yesClear').addEventListener('click',()=>{pieces=[];save();confirmEl.classList.add('hidden');SFX.trash();});
document.getElementById('noClear').addEventListener('click',()=>{confirmEl.classList.add('hidden');});
document.getElementById('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊':'🔇';save();if(soundOn){audio();SFX.pop();}});
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(mode==='play')stopPlay();else startPlay();}else if(e.key==='m'||e.key==='M')magic();});

// debug hook
window.__dbg={get pieces(){return pieces;},get sim(){return sim;},get mode(){return mode;},startPlay,stopPlay,magic,validate,createSim,randomMachine,genCandidate,
  setPieces(a){pieces=a.map(p=>makePiece(p.type,p.x,p.y,Object.assign({pop:0},p)));save();},add(t,x,y,extra){const p=makePiece(t,x,y,extra);pieces.push(p);save();return p;},TRASH,W,H,FLOOR};

// boot
load();
draw();
setInterval(()=>frame(performance.now()),16);
requestAnimationFrame(function raf(t){frame(t);requestAnimationFrame(raf);});
})();
</script>
</body>
</html>
